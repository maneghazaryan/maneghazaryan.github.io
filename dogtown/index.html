<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D1016">
<title>Dog Town — Get the game</title>
<meta name="description" content="Dog Town: Pet &amp; Animal Games. Download on Google Play or the App Store.">
<script>
(function () {
  var ANDROID = "https://play.google.com/store/apps/details?id=com.frismos.dogworld&hl=en_GB";
  var IOS = "https://apps.apple.com/us/app/dog-town-pet-animal-games/id1313818172";
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (/android/i.test(ua)) { location.replace(ANDROID); }
  else if (isIOS) { location.replace(IOS); }
})();
</script>
<style>
  html, body { margin: 0; background: #0D1016; color: #E7E9F0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; box-sizing: border-box; text-align: center; }
  h1 { margin: 0; font-size: clamp(32px, 7vw, 52px); letter-spacing: -0.02em; }
  p { margin: 0; color: #AEB4C4; max-width: 420px; line-height: 1.5; }
  .stores { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  a.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 10px; font-weight: 600; font-size: 16px; text-decoration: none; background: #A99BFF; color: #0D1016; }
  a.btn.alt { background: transparent; color: #E7E9F0; border: 1.5px solid #3A4152; }
  small { color: #8E95A8; }
  small a { color: #A99BFF; }
</style>
</head>
<body>
<main>
  <h1>Dog Town</h1>
  <p>Pet &amp; animal game. Choose your store:</p>
  <div class="stores">
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.frismos.dogworld&amp;hl=en_GB">Google Play</a>
    <a class="btn alt" href="https://apps.apple.com/us/app/dog-town-pet-animal-games/id1313818172">App Store</a>
  </div>
  <small>Back to <a href="/">Mane Ghazaryan's portfolio</a></small>
</main>
</body>
</html>
